<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · globe test</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html,body{height:100%;margin:0;background:#f4f4f2;font-family:Inter,system-ui,sans-serif;color:#2a2a2a;overflow:hidden}
  #map{position:absolute;inset:0}
  .hd{position:absolute;left:16px;top:14px;z-index:5;background:rgba(255,255,255,.92);border:1px solid #cdc8be;border-radius:4px;padding:10px 14px;max-width:360px}
  .hd h1{font:400 20px/1.1 "DM Serif Display",Georgia,serif;margin:0} .hd h1 em{font-style:italic;color:#1b6e62}
  .hd p{margin:6px 0 0;font-size:12.5px;color:#5a554c;line-height:1.45}
  .hd .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .ctl{position:absolute;right:16px;top:14px;z-index:5;display:flex;gap:6px}
  .ctl button{background:#fff;border:1px solid #cdc8be;border-radius:3px;font:12.5px Inter,sans-serif;padding:5px 9px;cursor:pointer;color:#5a554c} .ctl button.on{border-color:#2a2a2a;color:#2a2a2a}
  .tip{position:absolute;pointer-events:none;background:#fff;border:1px solid #cdc8be;padding:6px 9px;font-size:12px;border-radius:3px;display:none;z-index:6}
</style>
</head>
<body>
<div id="map"></div>
<div class="hd"><h1>EU ETS <em>Installations Atlas</em> · globe test</h1><p><span class="sw" style="background:#1a4a8a"></span>size = Mt CO₂ 2025, 7,797 emitting sites · drag to rotate, scroll to zoom. A prototype to judge the globe against the flat map, not the tool.</p></div>
<div class="ctl"><button id="b-globe" class="on">Globe</button><button id="b-flat">Flat</button><button id="b-eu">Europe</button></div>
<div class="tip" id="tip"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(async function () {
  const DATA = '#1a4a8a', SEA = '#0d3b66', SPACE = '#062f3d', SEA_INTRO = '#8593a0';
  const rows = await d3.csv('data/installations.csv', d => ({name: d.name, holder: d.holder, country: d.country, mt: d.mt_2025 === '' ? null : +d.mt_2025, chg: d.chg === '' ? null : +d.chg, lat: +d.lat, lon: +d.lon}));
  const em = rows.filter(d => d.mt > 0 && d.lat && d.lon), maxMt = d3.max(em, d => d.mt);
  const geo = {type: 'FeatureCollection', features: em.map(d => ({type: 'Feature', geometry: {type: 'Point', coordinates: [d.lon, d.lat]}, properties: {n: d.name, h: d.holder, c: d.country, mt: d.mt, r: Math.sqrt(d.mt / maxMt), chg: d.chg == null ? -999 : Math.max(-50, Math.min(50, d.chg))}}))};
  // intro mode (embedded in the atlas as the opening): no controls, slow rotation until the visitor touches it
  const INTRO = new URLSearchParams(location.search).has('intro'); if (INTRO) { document.querySelectorAll('.hd, .ctl').forEach(e => e.style.display = 'none'); document.body.style.background = SPACE; document.getElementById('map').style.background = SPACE; }
  const map = new maplibregl.Map({container: 'map', style: 'https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json', center: INTRO ? [-12, 38] : [12, 48], zoom: INTRO ? 2.05 : 2.6, attributionControl: {compact: true}});
  if (!INTRO) map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'bottom-right');
  if (INTRO) { let spin = true; const step = () => { if (!spin) return; const c = map.getCenter(); map.setCenter([c.lng + 0.012, c.lat]); requestAnimationFrame(step); };
    map.once('load', () => requestAnimationFrame(step)); ['mousedown', 'wheel', 'touchstart'].forEach(ev => map.on(ev, () => spin = false)); }
  map.on('style.load', () => {
    map.setProjection({type: 'globe'});
    map.getStyle().layers.forEach(l => { if (/water/i.test(l.id) && l.type === 'fill') map.setPaintProperty(l.id, 'fill-color', INTRO ? SEA_INTRO : SEA); if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', INTRO ? '#e1e5e9' : '#ffffff'); if (/landcover|landuse|park|building|wood|grass|hillshade|residential/i.test(l.id)) map.setLayoutProperty(l.id, 'visibility', 'none'); if (/waterway/i.test(l.id) && l.type === 'line') map.setPaintProperty(l.id, 'line-color', '#a9c4da'); if (/boundary_country/i.test(l.id)) { map.setPaintProperty(l.id, 'line-color', INTRO ? '#c3cad1' : '#9aaabb'); } });
    ['boundary_state', 'boundary_county'].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none'); });
    map.addSource('sites', {type: 'geojson', data: geo});
    map.addLayer({id: 'sites', type: 'circle', source: 'sites', paint: {
      'circle-color': INTRO ? ['case', ['<', ['get', 'chg'], -100], '#ffffff', ['interpolate', ['linear'], ['get', 'chg'], -50, '#14aecb', 0, '#2b3f78', 50, '#e0457b']] : DATA, 'circle-opacity': INTRO ? .9 : .8, 'circle-stroke-color': INTRO ? '#062f3d' : '#ffffff', 'circle-stroke-width': INTRO ? .3 : .6,
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 2, ['+', 1.2, ['*', 9, ['get', 'r']]], 6, ['+', 2, ['*', 26, ['get', 'r']]]],
      }, layout: {'circle-sort-key': ['-', 1, ['get', 'r']]}});
  });
  const tip = document.getElementById('tip');
  map.on('mousemove', 'sites', e => { const p = e.features[0].properties; tip.style.display = 'block'; tip.style.left = (e.point.x + 14) + 'px'; tip.style.top = (e.point.y + 14) + 'px'; tip.innerHTML = `<b>${p.n}</b><br>${p.h} · ${p.c}<br>${(+p.mt).toFixed(2)} Mt CO₂ 2025`; map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'sites', () => { tip.style.display = 'none'; map.getCanvas().style.cursor = ''; });
  const set = (id, on) => document.querySelectorAll('.ctl button').forEach(b => b.classList.toggle('on', b.id === id && on));
  document.getElementById('b-globe').onclick = () => { map.setProjection({type: 'globe'}); set('b-globe', true); };
  document.getElementById('b-flat').onclick = () => { map.setProjection({type: 'mercator'}); set('b-flat', true); };
  document.getElementById('b-eu').onclick = () => map.flyTo({center: [10, 51], zoom: 3.7, duration: 1400});
})();
</script>
</body>
</html>
